# HTTPS overlay for NotesApp
# Usage: docker compose -f docker-compose.yml -f docker-compose.https.yml up

services:
  web:
    ports: []
    expose:
      - "5000"

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
