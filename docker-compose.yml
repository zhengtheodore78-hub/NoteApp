services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
      JWT_SECRET: s3cr3t
      SECRET_KEY: dev-session-key
      AES_KEY: ${AES_KEY}   # loaded from .env (gitignored); never hard-code key material
    ports:
      - "8080:5000"
    depends_on:
      db:
        condition: service_healthy
    # Fixed: Removed dangerous volume mounts (docker.sock and host directory)

volumes:
  pgdata:
